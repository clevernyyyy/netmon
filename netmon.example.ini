; netmon config.
;   macOS:        ~/.config/netmon/netmon.ini   (API key in ~/.meraki_key)
;   Raspberry Pi: /etc/netmon/netmon.ini        (API key in /etc/netmon/env)

[meraki]
serial = XXXX-XXXX-XXXX        ; your MX serial (Dashboard > appliance status page)
network_id =                 ; optional, looked up from the serial
org_id =                     ; optional, looked up from the serial
probe_ip = 8.8.8.8          ; address the MX measures loss/latency against
interval_minutes = 10

[ping]
targets = 1.1.1.1, 8.8.8.8, 9.9.9.9
interval_seconds = 10
fail_threshold = 3          ; consecutive failed rounds before declaring an outage (~30s)

[speedtest]
interval_minutes = 60       ; 0 disables
expected_down_mbps =        ; your plan's speeds; leave blank to skip "slow" alerts
expected_up_mbps =
slow_alert_percent = 50     ; alert when a test is below this % of the plan

[alerts]
; Pick a long, random topic: anyone who knows it can read your alerts.
; Subscribe to the same topic in the ntfy phone app.
ntfy_url = https://ntfy.sh/CHANGE-ME
; Email: ntfy.sh only sends email for accounts. Create a free account at ntfy.sh, verify your
; address under Account, create an access token, and put it here. Free accounts: 5 emails/day.
ntfy_token =
email =                     ; "back up" alerts and the daily report are emailed here
daily_summary_hour = 8      ; local hour to send the daily report; blank disables

[storage]
; blank = OS default: ~/Library/Application Support/netmon/netmon.db on macOS,
; /var/lib/netmon/netmon.db on Linux
db =
